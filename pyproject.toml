[project]
name = "markgraph"
dynamic = ["version"]
description = "MCP server for knowledge graph extraction from markdown files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "knowledge-graph", "markdown", "obsidian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

authors = [
    { name = "agent-hanju", email = "agent.hanju@gmail.com" },
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/agent-hanju/markgraph"
Repository = "https://github.com/agent-hanju/markgraph"
Issues = "https://github.com/agent-hanju/markgraph/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
markgraph = "markgraph_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "markgraph_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["markgraph_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "strict"
